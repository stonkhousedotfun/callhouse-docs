name: docs checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    name: secrets, mirror, links and public copy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Gitleaks (checked-out source, redacted)
        run: |
          docker run --rm --network none \
            --volume "$GITHUB_WORKSPACE:/src:ro" --workdir /src \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            dir --redact --no-banner --log-level warn .
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: GitBook mirror
        run: node scripts/mirror.mjs --check
      - name: Local Markdown links
        run: node scripts/check-links.mjs
      - name: Public copy claims
        run: node scripts/copy-lint-docs.mjs
      - name: Public docs scope
        run: node scripts/check-commit-scope.mjs --tree
